name: Build Desktop App

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: backend
        run: uv sync --frozen --extra packaging --no-install-project

      - name: Verify spec file exists
        shell: bash
        run: ls -la packaging/pyinstaller/pcbgpt.spec

      - name: Build desktop app with PyInstaller
        working-directory: backend
        shell: bash
        run: uv run --no-sync python -m PyInstaller ../packaging/pyinstaller/pcbgpt.spec --distpath ../dist --workpath ../build
        env:
          PCBGPT_INCLUDE_SEED_DATASETS: "true"

      - name: List dist contents
        shell: bash
        run: ls -lhR dist/

      - name: Package (macOS) — create DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          hdiutil create -volname "pcbGPT" \
            -srcfolder dist/PCBGPT.app \
            -ov -format UDZO \
            pcbgpt-macos.dmg

      - name: Upload to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          if [ "${{ runner.os }}" = "macOS" ]; then
            gh release upload "$TAG" pcbgpt-macos.dmg --clobber
          else
            gh release upload "$TAG" dist/PCBGPT.exe --clobber
          fi
